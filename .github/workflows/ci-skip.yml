name: CI (skip shim)

# Companion to ci.yml. ci.yml carries a `paths:` filter, so the real CI jobs do
# NOT run for a PR that touches only non-code paths (workflow config, most
# docs). Branch protection still lists those jobs as REQUIRED, so such a PR
# deadlocks as "Expected — waiting for status to be reported" and can only be
# merged with an admin bypass.
#
# This workflow triggers on exactly the COMPLEMENT path set (paths-ignore =
# ci.yml's paths) and emits check runs with the SAME required job names,
# trivially successful. Branch protection matches required checks by name, so a
# workflow-/docs-only PR is now satisfied and mergeable without a bypass.
#
# The job names below MUST stay character-for-character identical to ci.yml's
# (including the "·" and "≥"). If you add, rename, or re-matrix a required job
# in ci.yml, mirror it here.
#
# Edge case — a "mixed" PR that touches BOTH code and non-code paths triggers
# the REAL ci.yml (its jobs run for real); keep code and workflow-config changes
# in separate PRs so the real signal is never ambiguous.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "whizzard/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - "docs/decisions.md"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."

  test:
    name: Tests (${{ matrix.os }} · Python ${{ matrix.python-version }})
    # Names must match ci.yml's matrix exactly. Everything runs on ubuntu here
    # (the step is a no-op) — the runner OS does not affect the check-run name.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."

  integration:
    name: Integration (real Docker)
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."

  coverage:
    name: Coverage (≥80%)
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."

  validate-decisions:
    name: Validate decisions.md
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."

  supply-chain:
    name: Supply-chain audit (pip-audit + digest pins)
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not applicable — no code paths touched; reporting skip-success."
